services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: gst_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gst_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gst_dev -d gst_dev']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
