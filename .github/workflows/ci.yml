name: Platform CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: gst_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gst_ci -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://gst_ci:ci-ephemeral-only@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://gst_ci:ci-ephemeral-only@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://gst_ci:ci-ephemeral-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          TEST_BACKUP_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm db:migrate
      - run: node scripts/smoke.mjs
  windows-script-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-SpikeScripts.ps1
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-BackupSchedule.ps1
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-DeploymentChecks.ps1
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-UpdateService.ps1
      - shell: powershell
        run: ./apps/windows-installer/launcher/Test-WindowsLauncher.ps1
      - shell: powershell
        run: ./scripts/issuer/Test-InternalWindowsSigning.ps1
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-LifecycleHost.ps1
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-BackupCredential.ps1
      - shell: powershell
        run: ./apps/windows-installer/scripts/Test-LanTrust.ps1
